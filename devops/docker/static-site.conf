# nginx INSIDE the plan-ui container: serves the two bundles and nothing else.
#
#   /              the plan board (Vite, hash-routed: #lf3/gantt)
#   /availability/ the standalone availability app, plain files
#
#   /api/          passed to this planner's plan-api, which holds the config and
#                  every plan
#
# So one published port is the whole planner, and the edge maps a hostname to it.

# Docker's embedded DNS, so plan-api is resolved per request: a plan-api that is
# down or still starting is a 502 on /api/, not a plan-ui that will not boot.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Answers whenever this container is up, so the edge can tell a missing
    # bundle from a missing container.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The service name, which is the same in every planner's own network. No
    # caching: a cached GET would hand somebody a plan that has moved on.
    location /api/ {
        set $plan_api "plan-api:3000";
        proxy_pass         http://$plan_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cache        off;
        add_header         Cache-Control     "no-store" always;
    }

    # Vite writes content-hashed filenames here, so a stale copy can never be
    # the wrong build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # availability/index.html names the current asset hashes, like the board's.
    location /availability/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /availability/index.html;
    }

    # index.html is the only file naming the current asset hashes; a cached copy
    # pins the browser to a dead build.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Open tabs poll this to learn a newer build is out; never cache it.
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Routing is in the hash (#lf8/gantt), so the server only ever sees "/" —
    # but a stray deep link should still land on the app rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
