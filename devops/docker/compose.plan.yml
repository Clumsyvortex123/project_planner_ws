# One planner: the shared plan store and the static bundles, on ONE loopback
# port. The TLS edge that puts it behind a hostname is compose.edge.yml, which
# runs once per box and fronts every planner on it.
#
#   cd devops/docker
#   docker compose -f compose.plan.yml up -d --build
#
# Several planners on one box: one checkout each (each has its own untracked
# planner.config.json), each with its own .env setting
#   COMPOSE_PROJECT_NAME  keeps the stacks apart: container names, images, the
#                         volume and the network all derive from it. Every
#                         checkout's compose file sits in a directory called
#                         `docker`, so without it they would all be ONE project
#                         and each `up` would recreate the other's containers.
#   PLAN_PORT             the loopback port this planner answers on; the edge's
#                         PLAN_SITES maps a hostname to it.
# Unset, both keep the original single-planner names: project `docker`,
# containers plan-api / plan-ui, port 8080, volume docker_plan_data.
#
# Required before the first `up`: planner.config.json at the repo root
# (untracked; copy planner.config.example.json). Without it docker creates a
# DIRECTORY at that path for the bind mount and plan-api has no config.

services:
  # The shared plan store. One JSON document per plan on the volume below, which
  # is the whole of this deployment's state — `docker cp` it and that is a backup.
  # Not published: plan-ui proxies /api/ to it over the network below.
  plan-api:
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile
      target: api-runner
    image: ${COMPOSE_PROJECT_NAME:-plan}-api:local
    container_name: ${COMPOSE_PROJECT_NAME:-plan}-api
    volumes:
      - plan_data:/data
      # The single config document. Edit it on the host and every board picks
      # it up within a poll; an edit saved from the app's Settings page is kept
      # on the volume and wins until "Revert to file". (Some editors replace the
      # file rather than rewrite it, which a single-file mount does not follow —
      # if a change is not seen, `docker compose restart plan-api`.)
      - ../../planner.config.json:/app/planner.config.json:ro
      # Shared with the host updater (devops/updater/): "Update now" on a board
      # writes request.json here, and the updater reports back in status.json.
      # Unset, it points at an empty folder and the boards offer no update button.
      - ${PLAN_UPDATE_DIR:-../../.updates}:/updates
    environment:
      UPDATE_DIR: /updates
      RELEASE_REPO: ${RELEASE_REPO:-Clumsyvortex123/project_planner_ws}
    networks:
      - plan-network
    restart: unless-stopped

  # The whole planner on one port: the bundles, and /api/ passed to plan-api.
  plan-ui:
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile
      target: static-runner
    image: ${COMPOSE_PROJECT_NAME:-plan}-ui:local
    container_name: ${COMPOSE_PROJECT_NAME:-plan}-ui
    # Loopback only. The edge runs on the host network and proxies here; nothing
    # off-box reaches this except through it.
    ports:
      - "127.0.0.1:${PLAN_PORT:-8080}:80"
    networks:
      - plan-network
    restart: unless-stopped

networks:
  plan-network:
    driver: bridge

volumes:
  # Every plan, every week note. The only state of this planner.
  plan_data:
